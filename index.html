<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="script.js" defer type="text/javascript"></script>
</head>
<body>
    <div class="layout">
        <h1>Tic Tac Toe</h1>
        <!-- Game -->
        <div class="boardtop">
            <p class="player-turn"></p>
            <button class="reset">Reset</button>
        </div>
        <div class="board-container">
            <div class="board"></div>
        </div>
        
        <!-- Pregame -->
        <h2 class="player-names">Input player names</h2>
        <form action="#" method="get" id="player-names">
            <div class="form-control">
                <input type="text" name="playerX" id="playerX" required>
                <label for="playerX" class="label">plays as X</label>
            </div>
            <div class="form-control">
                <input type="text" name="playerO" id="playerO" required>
                <label for="playerO" class="label">plays as O</label>
            </div>
            <button class="play">Play</button>
        </form>
    </div>
</body>
</html>
